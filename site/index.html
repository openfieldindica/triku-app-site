<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0754ed" />
    <title>Open Triku</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <section class="card">
        <div class="brand"><span class="brand-mark">T</span> Triku</div>
        <h1>Play. Predict. Win.</h1>
        <p>Open Triku to continue to <strong data-destination>the app</strong>.</p>
        <div class="actions">
          <a class="button" data-open-app href="triku://">Open Triku</a>
          <a class="button secondary" href="https://triku.in">Visit triku.in</a>
        </div>
        <p class="note">If Triku is not installed, visit triku.in for availability and download information.</p>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
