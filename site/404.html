<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0754ed" />
    <title>Open in Triku</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <section class="card">
        <div class="brand"><span class="brand-mark">T</span> Triku</div>
        <h1>Continue in the app</h1>
        <p>This link belongs to <strong data-destination>Triku</strong>. Open the app to continue securely.</p>
        <div class="actions">
          <a class="button" data-open-app href="triku://">Open Triku</a>
          <a class="button secondary" href="https://triku.in">Visit triku.in</a>
        </div>
        <p class="note">Only recognised Triku routes are passed to the app.</p>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
